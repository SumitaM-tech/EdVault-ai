name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx hardhat compile
      - name: Contract tests
        run: npx hardhat test
      - name: Type-check
        run: npm run typecheck
      - name: Backend tests
        run: npm test
      - name: Build
        run: npm run build

  frontend:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Tests
        run: npm test
      - name: Type-check and build
        run: npm run build
